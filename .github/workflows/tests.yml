name: Core tests

on:
  push:
    branches:
      - fix/harden-whatsapp-automation
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test and build dependencies
        run: python -m pip install -e ".[dev,build]"

      - name: Run static checks
        run: python -m ruff check app tests main.py

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run source self-test
        run: python -m app --self-test

      - name: Build Windows executable
        run: python -m PyInstaller --clean --noconfirm ToolsGuiTinWhatsApp.spec

      - name: Run packaged executable self-test
        shell: pwsh
        run: |
          & .\dist\ToolsGuiTinWhatsApp.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
