[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tools-tu-dong-gui-tn"
version = "0.2.0"
description = "Ứng dụng desktop tự động gửi tin nhắn WhatsApp hàng loạt qua máy ảo Android Studio"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "openpyxl>=3.1.5",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9.0",
]

[project.gui-scripts]
wa-tool = "app.__main__:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
